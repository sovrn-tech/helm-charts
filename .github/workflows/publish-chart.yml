# On a `v<version>` tag, package the chart, push it as an OCI artifact to
# ghcr.io/sovrn-tech/charts, and cut a GitHub Release with the .tgz.
#
# Consumers then:
#   helm install sovr oci://ghcr.io/sovrn-tech/charts/sovr-node --version <version>
# or a Flux HelmRelease against an OCIRepository at oci://ghcr.io/sovrn-tech/charts.
name: Publish chart

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v<version> tag to (re)publish"
        required: true

permissions:
  contents: write   # create the Release
  packages: write   # push the OCI chart to ghcr.io/sovrn-tech/charts

concurrency:
  group: publish-chart-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CHART_DIR: charts/sovr-node
  OCI_REPO: oci://ghcr.io/sovrn-tech/charts

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the tagged chart
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Verify Chart.yaml version matches the tag
        id: v
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CHART_V=$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml" | tr -d '"')
          if [ "$TAG" != "v${CHART_V}" ]; then
            echo "::error::tag $TAG != v(Chart.yaml version)=v${CHART_V}"; exit 1
          fi
          echo "version=${CHART_V}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: helm package "${CHART_DIR}" --destination dist

      - name: Log in to GHCR + push the OCI chart
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/sovr-node-${{ steps.v.outputs.version }}.tgz" "${OCI_REPO}"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${{ steps.v.outputs.version }}"
          printf 'OCI chart: `%s/sovr-node:%s`\n\nInstall:\n```\nhelm install sovr oci://ghcr.io/sovrn-tech/charts/sovr-node --version %s\n```\n' \
            "${OCI_REPO}" "$VER" "$VER" > /tmp/notes.md
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "sovr-node ${TAG}" --notes-file /tmp/notes.md
          gh release upload "$TAG" "dist/sovr-node-${VER}.tgz" --clobber
