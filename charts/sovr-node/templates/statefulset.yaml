{{- $staging := include "sovr-node.stagingList" . | fromJsonArray -}}
{{- $gcm := include "sovr-node.genesisConfigMap" . -}}
{{- $net := fromJson (include "sovr-node.net" .) -}}
{{- if and (eq .Values.mode "archive") (eq (len $net.bootstrap) 0) -}}
{{- fail (printf "\n\nmode=archive is not available for network %q: its from-genesis bootstrap ladder (networks.%s.bootstrap) is empty.\nThe mainnet ladder is bundled; the testnet pre-x/upgrade bootstrap is not yet characterized.\nUse mode=default (state-sync) for %s, or define networks.%s.bootstrap.\n" .Values.network .Values.network .Values.network .Values.network) -}}
{{- end -}}
{{- if and .Values.validator.enabled (not .Values.validator.privValidatorKeySecret) -}}
{{- fail "\n\nvalidator.enabled=true requires validator.privValidatorKeySecret — a Secret holding your UNIQUE consensus key.\nWithout it the node would sign with a randomly generated key (not your validator). Create it with:\n  kubectl create secret generic <name> --from-file=priv_validator_key.json=./priv_validator_key.json\nthen set validator.privValidatorKeySecret=<name>. NEVER run this key on two nodes at once (double-sign = slash + tombstone).\n" -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sovr-node.fullname" . }}
  labels:
    {{- include "sovr-node.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "sovr-node.fullname" . }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "sovr-node.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sovr-node.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/scripts: {{ include (print $.Template.BasePath "/configmap-scripts.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # 1. cosmovisor runtime (+ optional genesis-by-url + statesync trust anchor)
        - name: fetch
          image: {{ .Values.cosmovisor.downloadImage }}
          command: ["sh", "/scripts/fetch.sh"]
          env:
            {{- include "sovr-node.env" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /home/sovr/.sovr
            - name: scripts
              mountPath: /scripts
        # 2. scaffold home + install genesis + patch config
        - name: init-home
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "/scripts/init-home.sh"]
          env:
            {{- include "sovr-node.env" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /home/sovr/.sovr
            - name: scripts
              mountPath: /scripts
            {{- if $gcm }}
            - name: genesis
              mountPath: /genesis
            {{- end }}
        # 3. stage each binary + its libwasmvm + wrapper into its cosmovisor slot
        {{- range $i, $s := $staging }}
        - name: stage-{{ $i }}
          image: "{{ $.Values.image.repository }}:{{ $s.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["sh", "/scripts/stage.sh"]
          env:
            - name: HOME_DIR
              value: "/home/sovr/.sovr"
            - name: SLOT
              value: {{ $s.slot | quote }}
            - name: WASMVM_SONAME
              value: {{ $.Values.wasmvm.soname | quote }}
            - name: WASMVM_SRCDIR
              value: {{ $.Values.wasmvm.srcDir | quote }}
          volumeMounts:
            - name: data
              mountPath: /home/sovr/.sovr
            - name: scripts
              mountPath: /scripts
        {{- end }}
        {{- if eq .Values.mode "snapshot" }}
        # 4. snapshot restore (curl+TLS image; runs as root to install jq/zstd/cosign,
        #    verifies + cross-checks + extracts, then chowns data/ to the node uid)
        - name: restore-snapshot
          image: {{ .Values.snapshot.restoreImage }}
          command: ["sh", "/scripts/restore-snapshot.sh"]
          securityContext:
            runAsUser: 0
          env:
            {{- include "sovr-node.env" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /home/sovr/.sovr
            - name: scripts
              mountPath: /scripts
        {{- end }}
      containers:
        - name: sovrd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "/scripts/run.sh"]
          env:
            {{- include "sovr-node.env" . | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: p2p
              containerPort: 26656
            - name: rpc
              containerPort: 26657
            - name: grpc
              containerPort: 9090
            - name: api
              containerPort: 1317
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /home/sovr/.sovr
            - name: scripts
              mountPath: /scripts
            {{- if .Values.validator.enabled }}
            # Operator's consensus key, read-only, masking the init-generated one.
            - name: priv-validator-key
              mountPath: /home/sovr/.sovr/config/priv_validator_key.json
              subPath: priv_validator_key.json
              readOnly: true
            {{- if .Values.validator.nodeKeySecret }}
            - name: node-key
              mountPath: /home/sovr/.sovr/config/node_key.json
              subPath: node_key.json
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: scripts
          configMap:
            name: {{ include "sovr-node.fullname" . }}-scripts
            defaultMode: 0755
        {{- if .Values.validator.enabled }}
        - name: priv-validator-key
          secret:
            secretName: {{ .Values.validator.privValidatorKeySecret }}
            items:
              - key: priv_validator_key.json
                path: priv_validator_key.json
        {{- if .Values.validator.nodeKeySecret }}
        - name: node-key
          secret:
            secretName: {{ .Values.validator.nodeKeySecret }}
            items:
              - key: node_key.json
                path: node_key.json
        {{- end }}
        {{- end }}
        {{- if $gcm }}
        - name: genesis
          configMap:
            name: {{ $gcm }}
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
