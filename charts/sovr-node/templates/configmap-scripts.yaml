{{- $net := fromJson (include "sovr-node.net" .) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sovr-node.fullname" . }}-scripts
  labels:
    {{- include "sovr-node.labels" . | nindent 4 }}
data:
  # Per-binary wrapper: cosmovisor execs cosmovisor/<slot>/bin/sovrd (this), which
  # points LD_LIBRARY_PATH at that slot's OWN libwasmvm before exec'ing the real
  # binary. This is what lets one cosmovisor mix binaries needing different
  # libwasmvm versions that share the same soname.
  wrapper.sh: |
    #!/bin/sh
    d=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
    export LD_LIBRARY_PATH="$d/../lib:${LD_LIBRARY_PATH:-}"
    exec "$d/sovrd.real" "$@"

  # initContainer 1 (curl image): download cosmovisor + optional genesis-by-url +
  # optional statesync trust anchor. Idempotent.
  fetch.sh: |
    #!/bin/sh
    set -eu
    # Group-writable (umask 0002) so every container in the fsGroup (supplemental
    # gid) can write each other's dirs — the sovrd init container writes into the
    # config/ dir this curl container creates. chmod fixes it on a restart too.
    umask 0002
    H="$HOME_DIR"
    mkdir -p "$H/runtime" "$H/config"
    chmod g+rwx "$H" "$H/runtime" "$H/config" 2>/dev/null || true
    # The pin that produced the installed cosmovisor is recorded next to it, so a
    # `cosmovisor.downloadUrl` / `cosmovisor.version` bump takes effect on an
    # EXISTING volume too (before 0.3.0 the download was skipped whenever any
    # cosmovisor binary was present, making pin bumps silent no-ops). The marker
    # is new in 0.3.0, so the first start after that upgrade re-downloads once.
    MARK="$H/runtime/.cosmovisor-source"
    have=""; [ -f "$MARK" ] && have=$(cat "$MARK" 2>/dev/null || true)
    if [ ! -x "$H/runtime/cosmovisor" ] || [ "$have" != "$COSMOVISOR_URL" ]; then
      if [ -x "$H/runtime/cosmovisor" ]; then
        echo "[fetch] cosmovisor pin changed (${have:-unrecorded} -> $COSMOVISOR_URL) -- re-downloading"
      fi
      # cosmovisor.downloadUrl defaults to the linux-amd64 asset; on arm64 swap
      # the arch token so the binary matches the node (custom URLs pass through).
      CVURL="$COSMOVISOR_URL"
      case "$(uname -m)" in
        aarch64 | arm64) CVURL=$(printf '%s' "$CVURL" | sed 's/linux-amd64/linux-arm64/') ;;
      esac
      echo "[fetch] cosmovisor <- $CVURL"
      curl -fsSL "$CVURL" -o /tmp/cv.tgz
      if [ -n "$COSMOVISOR_SHA256" ]; then echo "$COSMOVISOR_SHA256  /tmp/cv.tgz" | sha256sum -c -; fi
      rm -rf "$H/runtime/.cv-new"; mkdir -p "$H/runtime/.cv-new"
      tar -xzf /tmp/cv.tgz -C "$H/runtime/.cv-new" cosmovisor 2>/dev/null || tar -xzf /tmp/cv.tgz -C "$H/runtime/.cv-new"
      chmod +x "$H/runtime/.cv-new/cosmovisor"
      mv -f "$H/runtime/.cv-new/cosmovisor" "$H/runtime/cosmovisor"
      rm -rf "$H/runtime/.cv-new" /tmp/cv.tgz
      printf '%s\n' "$COSMOVISOR_URL" > "$MARK"
    fi
    if [ -n "$GENESIS_URL" ] && [ ! -f "$H/config/genesis.json" ] && [ ! -f "$H/config/genesis.json.src" ]; then
      echo "[fetch] genesis <- $GENESIS_URL"
      curl -fsSL "$GENESIS_URL" -o "$H/config/genesis.json.src"
      if [ -n "$GENESIS_SHA256" ]; then echo "$GENESIS_SHA256  $H/config/genesis.json.src" | sha256sum -c -; fi
    fi
    if [ "$MODE" = "default" ] && [ "$STATESYNC_AUTOFETCH" = "true" ] && [ -z "$TRUST_HASH" ] && [ ! -f "$H/config/.statesync.env" ]; then
      RPC1=$(printf '%s' "$STATESYNC_RPCSERVERS" | cut -d, -f1)
      echo "[fetch] statesync trust anchor <- $RPC1"
      LATEST=$(curl -fsSL "$RPC1/block" 2>/dev/null | grep -oE '"height":"[0-9]+"' | head -1 | grep -oE '[0-9]+' || true)
      if [ -n "$LATEST" ]; then
        TH=$((LATEST - STATESYNC_OFFSET)); [ "$TH" -lt 1 ] && TH=1
        HH=$(curl -fsSL "$RPC1/block?height=$TH" 2>/dev/null | grep -oE '"hash":"[A-F0-9]+"' | head -1 | sed -E 's/.*"hash":"([A-F0-9]+)".*/\1/' || true)
        if [ -n "$HH" ]; then
          printf 'TRUST_HEIGHT=%s\nTRUST_HASH=%s\n' "$TH" "$HH" > "$H/config/.statesync.env"
          echo "[fetch] trust_height=$TH trust_hash=$HH"
        else echo "[fetch] WARN: could not derive trust_hash; set stateSync.trustHeight/Hash manually"; fi
      else echo "[fetch] WARN: could not reach $RPC1 for a trust anchor"; fi
    fi

  # initContainer 2 (sovrd image): scaffold home + install genesis + patch config.
  init-home.sh: |
    #!/bin/sh
    set -eu
    umask 0002
    H="$HOME_DIR"; CFG="$H/config/config.toml"; APP="$H/config/app.toml"
    mkdir -p "$H/config" "$H/data"
    if [ ! -f "$CFG" ]; then
      echo "[init] sovrd init $MONIKER ($CHAIN_ID)"
      sovrd init "$MONIKER" --chain-id "$CHAIN_ID" --home "$H" >/dev/null 2>&1 || \
        sovrd init "$MONIKER" --chain-id "$CHAIN_ID" --home "$H"
    fi
    if [ -f /genesis/genesis.json ]; then cp /genesis/genesis.json "$H/config/genesis.json";
    elif [ -f "$H/config/genesis.json.src" ]; then cp "$H/config/genesis.json.src" "$H/config/genesis.json";
    elif [ ! -s "$H/config/genesis.json" ]; then
      echo "[init] ERROR: no genesis (set genesis.configMap or genesis.url)"; exit 1; fi
    sed -i 's|^moniker *=.*|moniker = "'"$MONIKER"'"|' "$CFG"
    sed -i 's|^laddr = "tcp://127.0.0.1:26657"|laddr = "tcp://0.0.0.0:26657"|' "$CFG"
    sed -i 's|^minimum-gas-prices *=.*|minimum-gas-prices = "'"$MIN_GAS_PRICES"'"|' "$APP"
    sed -i 's|^pruning *=.*|pruning = "'"$PRUNING"'"|' "$APP"
    sed -i '/^\[api\]/,/^\[/ s|^enable *=.*|enable = true|' "$APP"
    sed -i '/^\[api\]/,/^\[/ s|^address *=.*|address = "tcp://0.0.0.0:1317"|' "$APP"
    sed -i '/^\[grpc\]/,/^\[/ s|^address *=.*|address = "0.0.0.0:9090"|' "$APP"
    if [ "$MODE" = "archive" ]; then
      sed -i '/^\[p2p\]/,/^\[/ s|^pex *=.*|pex = false|' "$CFG"
      sed -i '/^\[p2p\]/,/^\[/ s|^addr_book_strict *=.*|addr_book_strict = false|' "$CFG"
      sed -i '/^\[p2p\]/,/^\[/ s|^persistent_peers *=.*|persistent_peers = "'"$ARCHIVE_PEER"'"|' "$CFG"
      rm -f "$H/config/addrbook.json"
      sed -i '/^\[statesync\]/,/^\[/ s|^enable *=.*|enable = false|' "$CFG"
    elif [ "$MODE" = "snapshot" ]; then
      # data is restored from a published snapshot (by the restore-snapshot init);
      # disable statesync and blocksync the small gap to head via normal peers.
      sed -i '/^\[statesync\]/,/^\[/ s|^enable *=.*|enable = false|' "$CFG"
      if [ -n "$SEEDS" ]; then
        sed -i '/^\[p2p\]/,/^\[/ s|^seeds *=.*|seeds = "'"$SEEDS"'"|' "$CFG"
      fi
      if [ -n "$PERSISTENT_PEERS" ]; then
        sed -i '/^\[p2p\]/,/^\[/ s|^persistent_peers *=.*|persistent_peers = "'"$PERSISTENT_PEERS"'"|' "$CFG"
      fi
    else
      TH="$TRUST_HEIGHT"; HH="$TRUST_HASH"
      if [ -f "$H/config/.statesync.env" ]; then . "$H/config/.statesync.env"; TH="${TRUST_HEIGHT:-$TH}"; HH="${TRUST_HASH:-$HH}"; fi
      sed -i '/^\[statesync\]/,/^\[/ s|^enable *=.*|enable = true|' "$CFG"
      sed -i '/^\[statesync\]/,/^\[/ s|^rpc_servers *=.*|rpc_servers = "'"$STATESYNC_RPCSERVERS"'"|' "$CFG"
      sed -i '/^\[statesync\]/,/^\[/ s|^trust_height *=.*|trust_height = '"${TH:-0}"'|' "$CFG"
      sed -i '/^\[statesync\]/,/^\[/ s|^trust_hash *=.*|trust_hash = "'"${HH:-}"'"|' "$CFG"
      if [ -n "$SEEDS" ]; then
        sed -i '/^\[p2p\]/,/^\[/ s|^seeds *=.*|seeds = "'"$SEEDS"'"|' "$CFG"
      fi
      if [ -n "$PERSISTENT_PEERS" ]; then
        sed -i '/^\[p2p\]/,/^\[/ s|^persistent_peers *=.*|persistent_peers = "'"$PERSISTENT_PEERS"'"|' "$CFG"
      fi
    fi
    # Validator: advertise the dialable P2P address so peers can reach the signer.
    if [ -n "${EXTERNAL_ADDRESS:-}" ]; then
      sed -i '/^\[p2p\]/,/^\[/ s|^external_address *=.*|external_address = "'"$EXTERNAL_ADDRESS"'"|' "$CFG"
      echo "[init] external_address = $EXTERNAL_ADDRESS"
    fi
    echo "[init] config patched (mode=$MODE)"

  # initContainer 3..N (one per version image): stage sovrd + its libwasmvm + wrapper.
  # Idempotent, and it RE-STAGES when the slot's binary, libwasmvm or wrapper
  # differs from the image's: an `image.tag` bump (genesis slot), a corrected
  # upgrade tag or a wrapper change now takes effect on an existing volume
  # (before 0.3.0 any staged binary was kept, so the pod spec changed while the
  # node silently kept running the old binary).
  # Files are copied under temp names and `mv`ed last, so an interrupted init
  # never leaves a slot with a half-written binary.
  stage.sh: |
    #!/bin/sh
    set -eu
    umask 0002
    S="$HOME_DIR/cosmovisor/$SLOT"
    SRC="${SOVRD_BIN:-/usr/local/bin/sovrd}"
    WRAP="${WRAPPER_SH:-/scripts/wrapper.sh}"
    LIB="$WASMVM_SRCDIR/$WASMVM_SONAME"
    same_file() {
      if command -v cmp >/dev/null 2>&1; then cmp -s "$1" "$2"; else
        [ "$(sha256sum "$1" | cut -d' ' -f1)" = "$(sha256sum "$2" | cut -d' ' -f1)" ]; fi
    }
    if [ -x "$S/bin/sovrd.real" ] && [ -x "$S/bin/sovrd" ] && [ -f "$S/lib/$WASMVM_SONAME" ] \
       && same_file "$SRC" "$S/bin/sovrd.real" && same_file "$LIB" "$S/lib/$WASMVM_SONAME" && same_file "$WRAP" "$S/bin/sovrd"; then
      echo "[stage] $SLOT already staged (binary, libwasmvm and wrapper match the image)"; exit 0
    fi
    if [ -x "$S/bin/sovrd.real" ]; then
      echo "[stage] $SLOT: staged binary, libwasmvm or wrapper differs from the image (or the slot is incomplete) -- re-staging"
    fi
    mkdir -p "$S/bin" "$S/lib"
    cp "$SRC" "$S/bin/.sovrd.real.tmp"
    cp "$LIB" "$S/lib/.$WASMVM_SONAME.tmp"
    cp "$WRAP" "$S/bin/.sovrd.tmp"
    chmod +x "$S/bin/.sovrd.real.tmp" "$S/bin/.sovrd.tmp"
    mv -f "$S/lib/.$WASMVM_SONAME.tmp" "$S/lib/$WASMVM_SONAME"
    mv -f "$S/bin/.sovrd.tmp" "$S/bin/sovrd"
    mv -f "$S/bin/.sovrd.real.tmp" "$S/bin/sovrd.real"
    echo "[stage] $SLOT staged"

  # archive-mode bootstrap: drive the from-genesis ladder with --halt-height at
  # EVERY boundary (self-halt is unreliable — v0.16.2 forks v0.20.0-combined@
  # 1210440), swapping binaries by hand. `--halt-height H` commits H-1; the next
  # binary executes H. The current binary (v0.23.0 = cosmovisor genesis bin, run
  # by run.sh AFTER this completes) applies v0.23.0-combined@1356994 and runs to
  # tip. Idempotent + resumable via a progress marker (last completed boundary),
  # so an interrupted run resumes the in-flight range and completed stages are
  # skipped — old binaries never re-run against the v0.23.0-migrated state.
  bootstrap.sh: |
    #!/bin/sh
    set -u
    H="$HOME_DIR"
    if [ -f "$H/.bootstrap-complete" ]; then
      echo "[bootstrap] already complete — cosmovisor (v0.23.0) takes over"; exit 0
    fi
    prog=0; [ -f "$H/.bootstrap-progress" ] && prog=$(cat "$H/.bootstrap-progress" 2>/dev/null || echo 0)
    run_stage() { # $1=slot  $2=haltHeight
      slot="$1"; hh="$2"
      if [ "$hh" -le "$prog" ]; then echo "[bootstrap] skip $slot (halt $hh <= progress $prog)"; return 0; fi
      echo "[bootstrap] $slot start --halt-height $hh"
      # log to the data PVC, not /tmp — a large segment's output can be tens of MB
      log="$H/.bootstrap-stage.log"
      "$H/cosmovisor/$slot/bin/sovrd" start --home "$H" --halt-height "$hh" >"$log" 2>&1 || true
      if grep -q "halt per configuration height $hh" "$log"; then
        prog="$hh"; printf '%s' "$prog" > "$H/.bootstrap-progress"
        echo "[bootstrap]   clean halt at $hh"; rm -f "$log"
      else
        echo "[bootstrap] ERROR: $slot did not halt cleanly at $hh (resume on restart). tail:"
        tail -8 "$log" 2>/dev/null; rm -f "$log"; exit 1
      fi
    }
    {{- range $net.bootstrap }}
    run_stage "{{ .slot }}" {{ int64 .haltHeight }}
    {{- end }}
    touch "$H/.bootstrap-complete"
    echo "[bootstrap] complete (last boundary $prog) — cosmovisor (v0.23.0) applies v0.23.0-combined@1356994, runs to tip"

  # snapshot-mode restore (runs in a curl+TLS init container as root so it can
  # install jq/zstd + fetch cosign; the sovrd image's curl has no CA bundle). All
  # gates fail closed: cosign-verify the signed manifest, cross-check its block_hash
  # against TWO independent anchors, sha256-verify, then extract data/. Skipped once
  # .snapshot-restored exists. Extracted data is chown'd to the node uid (1000).
  restore-snapshot.sh: |
    #!/bin/sh
    set -eu
    H="$HOME_DIR"
    if [ -f "$H/.snapshot-restored" ]; then echo "[snapshot] already restored — skipping"; exit 0; fi
    [ -n "$SNAPSHOT_BASEURL" ] || { echo "[snapshot] ERROR: snapshot.baseUrl unset"; exit 1; }
    base="$SNAPSHOT_BASEURL/$NETWORK/archive"
    W="$H/.snapshot-work"; rm -rf "$W"; mkdir -p "$W" "$H/data"; cd "$W"
    if ! command -v jq >/dev/null || ! command -v unzstd >/dev/null; then
      apk add --no-cache jq zstd >/dev/null 2>&1 || { echo "[snapshot] ERROR: apk add jq zstd failed"; exit 1; }
    fi
    if command -v cosign >/dev/null 2>&1; then COSIGN=cosign; else
      case "$(uname -m)" in
        x86_64) CARCH=amd64 ;;
        aarch64 | arm64) CARCH=arm64 ;;
        *) echo "[snapshot] ERROR: unsupported arch $(uname -m) for cosign download"; exit 1 ;;
      esac
      curl -fsSL "https://github.com/sigstore/cosign/releases/download/${SNAPSHOT_COSIGN_VERSION}/cosign-linux-${CARCH}" -o /tmp/cosign
      chmod +x /tmp/cosign; COSIGN=/tmp/cosign
    fi
    echo "[snapshot] resolving $base/latest.json"
    curl -fsSL "$base/latest.json" -o latest.json
    curl -fsSL "$base/latest.json.sig" -o latest.json.sig
    # 1. authenticity (fail-closed)
    if [ -n "$SNAPSHOT_COSIGN_PUBKEY" ]; then
      printf '%s' "$SNAPSHOT_COSIGN_PUBKEY" > cosign.pub
      "$COSIGN" verify-blob --key cosign.pub --signature latest.json.sig latest.json >/dev/null 2>&1 \
        || { echo "[snapshot] FAIL-CLOSED: manifest signature invalid (keyed)"; exit 4; }
    else
      [ -n "$SNAPSHOT_COSIGN_IDENTITY" ] && [ -n "$SNAPSHOT_COSIGN_ISSUER" ] \
        || { echo "[snapshot] ERROR: set snapshot.cosignPublicKey OR (cosignIdentity + cosignIssuer)"; exit 1; }
      "$COSIGN" verify-blob --certificate-identity "$SNAPSHOT_COSIGN_IDENTITY" \
        --certificate-oidc-issuer "$SNAPSHOT_COSIGN_ISSUER" --signature latest.json.sig latest.json >/dev/null 2>&1 \
        || { echo "[snapshot] FAIL-CLOSED: manifest signature invalid (keyless)"; exit 4; }
    fi
    echo "[snapshot] signature OK"
    file=$(jq -r .file latest.json); want=$(jq -r .sha256 latest.json)
    height=$(jq -r .height latest.json); bhash=$(jq -r .block_hash latest.json); cid=$(jq -r .chain_id latest.json)
    [ "$cid" = "$CHAIN_ID" ] || { echo "[snapshot] FAIL-CLOSED: snapshot chain_id $cid != $CHAIN_ID"; exit 4; }
    # 2. canonical cross-check: signed manifest block_hash vs TWO independent
    # anchors. This anchors the *claimed* height to the real chain — it does not
    # re-derive a hash from the extracted data (the node isn't running yet). The
    # extracted bytes are guaranteed instead by step 3 (sha256 over the tarball,
    # signed in the manifest) + the unzstd-failure guard in step 4; a post-start
    # consensus re-check of the restored data is verify-archive-snapshot.sh
    # `crosscheck` against the live node (docs/node-operations.md §5).
    A=$(printf '%s' "$SNAPSHOT_ANCHORS" | cut -d, -f1); B=$(printf '%s' "$SNAPSHOT_ANCHORS" | cut -d, -f2)
    { [ -n "$A" ] && [ -n "$B" ] && [ "$A" != "$B" ]; } || {
      echo "[snapshot] FAIL-CLOSED: mode=snapshot needs TWO distinct RPC anchors in"
      echo "  snapshot.crosscheckAnchors (a list of >=2). The chart pre-fills rpc + rpc2;"
      echo "  if you overrode them, provide two distinct endpoints."
      exit 4; }
    ha=$(curl -fsSL "$A/block?height=$height" | jq -r '.result.block_id.hash')
    hb=$(curl -fsSL "$B/block?height=$height" | jq -r '.result.block_id.hash')
    if [ "$bhash" != "$ha" ] || [ "$bhash" != "$hb" ]; then
      echo "[snapshot] FAIL-CLOSED: block $height disagreement (manifest=$bhash A=$ha B=$hb)"; exit 4
    fi
    echo "[snapshot] cross-check OK: manifest + both anchors agree on block $height"
    # 3. download + integrity (fail-closed)
    echo "[snapshot] downloading $file"; curl -fsSL "$base/$file" -o "$file"
    got=$(sha256sum "$file" | awk '{print $1}')
    [ "$got" = "$want" ] || { echo "[snapshot] FAIL-CLOSED: checksum $got != $want"; exit 4; }
    echo "[snapshot] checksum OK"
    # 4. extract data/ (full history) into the node home.
    # POSIX /bin/sh under `set -eu` has no pipefail, so `unzstd -c | tar` would
    # report tar's status only: an OOM-killed / truncated unzstd mid-stream can
    # leave tar exiting 0 on the partial input it did receive, marking the node
    # restored on incomplete chain data. Capture unzstd's own rc across the pipe
    # (subshell writes it to a file) and fail closed if it is non-zero.
    case "$file" in
      *.tar.zst)
        rc="$W/.unzstd_rc"; rm -f "$rc"
        { unzstd -c "$file" || echo "$?" > "$rc"; } | tar -C "$H" -xf -
        if [ -s "$rc" ]; then
          echo "[snapshot] FAIL-CLOSED: unzstd failed (rc=$(cat "$rc")) during extraction — partial/corrupt data"; exit 4
        fi
        ;;
      *.tar.gz)  tar -C "$H" -xzf "$file" ;;
      *) echo "[snapshot] ERROR: unknown format $file"; exit 1 ;;
    esac
    [ -d "$H/data" ] || { echo "[snapshot] ERROR: extraction produced no data/"; exit 1; }
    # A published snapshot's data/ carries the producer's last upgrade-info.json
    # (x/upgrade writes it at the halt). It is KEPT: the startup switch
    # (switch-pending-upgrade.sh) picks the newest staged binary for it and
    # records the plan into that slot, so a node installed from a post-height
    # snapshot boots the right version even while image.tag still names the
    # pre-height one, and cosmovisor never mistakes the file for a newer upgrade.
    # (Before 0.3.0 the file was deleted here because cosmovisor 1.7.x would
    # otherwise kill the genesis binary and fail on the missing slot.)
    if [ -s "$H/data/upgrade-info.json" ]; then
      echo "[snapshot] keeping data/upgrade-info.json ($(tr -d '\n' < "$H/data/upgrade-info.json" | cut -c1-120)...); the startup switch selects the binary"
    fi
    rm -rf "$W"; touch "$H/.snapshot-restored"
    chown -R 1000:1000 "$H/data" "$H/.snapshot-restored" 2>/dev/null || true
    echo "[snapshot] restored to height $height; node will blocksync the gap to head"

  # Shared helpers, sourced by the upgrade scripts (`. "$SCRIPTS_DIR/lib.sh"`).
  lib.sh: |
    # upgrade_info_field FILE KEY -> prints the first top-level string/number
    # value of KEY in an x/upgrade upgrade-info.json. x/upgrade marshals the
    # Plan as {"name":..,"time":..,"height":..,"info":..} in that order, so the
    # FIRST match is the real field even when `info` quotes the same words.
    # jq is preferred when the image has it; the grep path needs only POSIX
    # tools (sovrd images before 0.28 ship no jq).
    upgrade_info_field() {
      if [ -z "${UPGRADE_INFO_NO_JQ:-}" ] && command -v jq >/dev/null 2>&1; then
        jq -r --arg k "$2" '.[$k] // empty' "$1" 2>/dev/null
      else
        grep -oE "\"$2\"[[:space:]]*:[[:space:]]*\"?[^\",}]*\"?" "$1" 2>/dev/null \
          | head -1 | sed -e 's/^"[^"]*"[[:space:]]*:[[:space:]]*//' -e 's/^"//' -e 's/"$//'
      fi
    }

    # sovrd_version BIN -> the binary's own `sovrd version` (through its slot
    # wrapper, which supplies its libwasmvm); empty when it cannot be read.
    sovrd_version() { "$1" version 2>/dev/null | head -1 | tr -d '[:space:]'; }

    # ver_cmp A B -> prints -1, 0 or 1 for A <, =, > B. Versions look like
    # [v]MAJOR.MINOR.PATCH[-suffix]. The numeric fields decide; on a tie a
    # release beats a pre-release (-rc1, -beta…) and a git-describe build past
    # the release tag (-N-gHASH, what `make build` stamps) beats the release.
    # Within a rank: pre-releases compare by their numeric tail when the label
    # matches (rc1 < rc2) and by plain string order otherwise; describe builds
    # compare by distance (-10-g… < -20-g…). A describe build past an rc tag
    # (-rc2-5-g…) is still a pre-release, newer than -rc2 and older than the
    # release.
    num_cmp() { if [ "$1" -gt "$2" ]; then echo 1; elif [ "$1" -lt "$2" ]; then echo -1; else echo 0; fi; }
    ver_cmp() {
      a=${1#v}; b=${2#v}; an=${a%%-*}; bn=${b%%-*}; as=${a#"$an"}; bs=${b#"$bn"}
      i=1
      while [ "$i" -le 3 ]; do
        x=$(printf '%s' "$an" | cut -d. -f"$i"); y=$(printf '%s' "$bn" | cut -d. -f"$i")
        x=${x:-0}; y=${y:-0}
        case "$x$y" in
          *[!0-9]*) ;;
          *) r=$(num_cmp "$x" "$y"); [ "$r" = 0 ] || { echo "$r"; return; } ;;
        esac
        i=$((i + 1))
      done
      ver_rank() { case "$1" in "") echo 1 ;; -[0-9]*-g*) echo 2 ;; *) echo 0 ;; esac; }
      ra=$(ver_rank "$as"); rb=$(ver_rank "$bs")
      r=$(num_cmp "$ra" "$rb"); [ "$r" = 0 ] || { echo "$r"; return; }
      case "$ra" in
        1) echo 0 ;;
        2) da=${as#-}; da=${da%%-*}; db=${bs#-}; db=${db%%-*}; num_cmp "$da" "$db" ;;
        0) ta=${as#-}; tb=${bs#-}
           da=0; db=0
           case "$ta" in
             *-[0-9]*-g*) base=${ta%-g*}; da=${base##*-}; ta=${base%-*} ;;
           esac
           case "$tb" in
             *-[0-9]*-g*) base=${tb%-g*}; db=${base##*-}; tb=${base%-*} ;;
           esac
           la=$(printf '%s' "$ta" | sed 's/[0-9]*$//'); lb=$(printf '%s' "$tb" | sed 's/[0-9]*$//')
           na=${ta#"$la"}; nb=${tb#"$lb"}
           if [ "$la" = "$lb" ] && [ -n "$na$nb" ]; then r=$(num_cmp "${na:-0}" "${nb:-0}")
           elif [ "$ta" = "$tb" ]; then r=0
           elif [ "$(printf '%s\n%s\n' "$ta" "$tb" | sort | head -1)" = "$ta" ]; then r=-1
           else r=1; fi
           if [ "$r" = 0 ]; then num_cmp "$da" "$db"; else echo "$r"; fi ;;
      esac
    }

  # Run by run.sh on EVERY start, before cosmovisor: choose the binary cosmovisor
  # runs. Candidates are the genesis slot (image.tag), the slot `current` points
  # at today, and -- when data/upgrade-info.json (written by x/upgrade at the
  # halt) names a plan staged under cosmovisor/upgrades/<plan> -- that plan's
  # slot. The NEWEST `sovrd version` wins (ties go to genesis), so:
  #   * at a halt, image.tag v0.27.4 + a staged v0.28.0 plan slot -> the plan slot
  #     (the upgrade handler runs on the next start);
  #   * after the height, moving image.tag to v0.28.1 -> back to genesis (the
  #     bump is not a silent no-op; a newer release carries the older handlers);
  #   * a kept `upgrades` entry can never roll the node back to an older binary.
  # The chosen slot also gets a copy of data/upgrade-info.json: cosmovisor reads
  # current/upgrade-info.json to learn which plan the running binary belongs to,
  # and would otherwise swap to the plan's slot (even an older one) the moment
  # `sovrd status` answers. Needed in the first place because the pinned
  # cosmovisor (1.7.x) only switches after a successful `status` whose height
  # has reached the plan height -- at a real halt the app has already panicked,
  # so `status` fails, the check is false, cosmovisor exits with the app's error
  # and the old binary replays the halt block forever (cosmos/cosmos-sdk#26091,
  # #22731; the fix #23720 is in no released cosmovisor). With this script the
  # halt costs exactly one automatic container restart. It never fails the start.
  switch-pending-upgrade.sh: |
    #!/bin/sh
    set -u
    . "${SCRIPTS_DIR:-/scripts}/lib.sh"
    H="$HOME_DIR"; ROOT="$H/cosmovisor"; INFO="$H/data/upgrade-info.json"
    log() { echo "[switch] $*"; }
    [ -x "$ROOT/genesis/bin/sovrd" ] || { log "WARN: no genesis slot staged; leaving cosmovisor alone"; exit 0; }
    # What cosmovisor would run now: "", "genesis" or "upgrades/<name>" (the
    # link is relative; an absolute one from an older hand fix is normalized).
    cur=""
    if [ -L "$ROOT/current" ]; then cur=$(readlink "$ROOT/current" 2>/dev/null || true); fi
    cur=${cur#"$ROOT/"}; cur=${cur%/}
    if [ -n "$cur" ] && [ ! -x "$ROOT/$cur/bin/sovrd" ]; then
      log "current -> $cur is dangling (its slot is gone); falling back to genesis"; cur=""
    fi
    # The plan x/upgrade recorded, if any, and its slot when staged.
    name=""; height=""; pslot=""
    if [ -s "$INFO" ]; then
      name=$(upgrade_info_field "$INFO" name); height=$(upgrade_info_field "$INFO" height)
      if [ -z "$name" ]; then
        log "WARN: cannot read the plan name from $INFO"
      elif [ -x "$ROOT/upgrades/$name/bin/sovrd" ]; then
        pslot="upgrades/$name"
      else
        log "plan $name@${height:-?} is recorded but upgrades/$name is not staged (if it is still pending, add it to networks.<network>.upgrades)"
      fi
    fi
    # Versions of the candidates.
    gv=$(sovrd_version "$ROOT/genesis/bin/sovrd")
    xv=""; if [ -n "$cur" ] && [ "$cur" != genesis ]; then xv=$(sovrd_version "$ROOT/$cur/bin/sovrd"); fi
    pv=""; if [ -n "$pslot" ] && [ "$pslot" != "$cur" ]; then pv=$(sovrd_version "$ROOT/$pslot/bin/sovrd"); fi
    unreadable=0
    [ -n "$gv" ] || unreadable=1
    if [ -n "$cur" ] && [ "$cur" != genesis ] && [ -z "$xv" ]; then unreadable=1; fi
    if [ -n "$pslot" ] && [ "$pslot" != "$cur" ] && [ -z "$pv" ]; then unreadable=1; fi
    if [ "$unreadable" = 1 ]; then
      # Cannot compare: trust the operator's plan mapping for a pending plan,
      # otherwise stay where we are.
      if [ -n "$pslot" ] && [ "$pslot" != "$cur" ]; then
        best="$pslot"; why="plan $name@${height:-?} is staged as upgrades/$name (versions unreadable: genesis='$gv' plan='$pv')"
      else
        best="${cur:-genesis}"; why="versions unreadable (genesis='$gv' current='$xv'); keeping the current selection"
      fi
      log "WARN: could not read every binary's version"
    else
      best=genesis; bestv="$gv"; why="image.tag binary $gv is the newest staged"
      if [ -n "$xv" ] && [ "$(ver_cmp "$xv" "$bestv")" -gt 0 ]; then
        best="$cur"; bestv="$xv"; why="active slot $cur ($xv) is newer than the image.tag binary ($gv)"
      fi
      if [ -n "$pv" ] && [ "$(ver_cmp "$pv" "$bestv")" -gt 0 ]; then
        best="$pslot"; bestv="$pv"; why="plan $name@${height:-?} is pending and upgrades/$name ($pv) is newer than ${cur:-genesis} ($( [ -n "$xv" ] && echo "$xv" || echo "$gv" ))"
      elif [ -n "$pslot" ] && [ "$pslot" != "$cur" ]; then
        why="$why; plan $name@${height:-?} is staged as $pv but not newer, so it is not activated"
      fi
    fi
    # Mirror the recorded plan into the selected slot (see the header comment).
    if [ -s "$INFO" ] && ! cmp -s "$INFO" "$ROOT/$best/upgrade-info.json" 2>/dev/null; then
      if cp "$INFO" "$ROOT/$best/.upgrade-info.json.tmp" && mv -f "$ROOT/$best/.upgrade-info.json.tmp" "$ROOT/$best/upgrade-info.json"; then
        log "recorded plan ${name:-?}@${height:-?} into $best/upgrade-info.json"
      else
        log "WARN: could not write $best/upgrade-info.json"
      fi
    fi
    # Same relative link cosmovisor's SetCurrentUpgrade writes (its workdir is
    # the cosmovisor dir).
    if [ "$best" != "$cur" ]; then
      if ln -sfn "$best" "$ROOT/current"; then log "current ${cur:-<unset>} -> $best: $why"; else log "WARN: could not re-point current to $best; cosmovisor keeps ${cur:-genesis}"; fi
    else
      log "current -> $cur unchanged: $why"
    fi
    exit 0

  # main container entrypoint.
  run.sh: |
    #!/bin/sh
    set -eu
    export DAEMON_HOME="$HOME_DIR"
    export DAEMON_NAME=sovrd
    export DAEMON_RESTART_AFTER_UPGRADE=true
    export DAEMON_ALLOW_DOWNLOAD_BINARIES=false
    # Slot directories are named after the exact on-chain Plan.Name; stop
    # cosmovisor lowercasing the name it reads from upgrade-info.json (its
    # default), or a mixed-case plan would never be found.
    export COSMOVISOR_DISABLE_RECASE=true
    # cosmovisor's own switch (when it does run) first copies the whole data/ dir
    # unless this is set -- minutes of extra downtime and 2x disk. The startup
    # switch below never backs up. Set cosmovisor.skipBackup=false to keep backups.
    export UNSAFE_SKIP_BACKUP="${COSMOVISOR_SKIP_BACKUP:-true}"
    if [ "$MODE" = "archive" ]; then /scripts/bootstrap.sh; fi
    sh /scripts/switch-pending-upgrade.sh || echo "[run] WARN: switch-pending-upgrade.sh failed; starting cosmovisor anyway"
    echo "[run] starting cosmovisor (mode=$MODE)"
    exec "$HOME_DIR/runtime/cosmovisor" run start --home "$HOME_DIR"
